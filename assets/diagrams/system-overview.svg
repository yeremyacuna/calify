<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1010" viewBox="0 0 820 1010" role="img" aria-labelledby="title desc">
<title id="title">Calify V1 — Vertical System Architecture</title>
<desc id="desc">Top-down black-and-white architecture diagram showing Apple Shortcuts Mobile Client, HTTPS JSON, Google Apps Script Web API, Google Sheets Data Layer, Grade Entry and Settings feeding Control calculations and Dashboard output.</desc>
<style>
  .stroke{stroke:#202020;stroke-width:2;fill:none}
  .thin{stroke:#505050;stroke-width:1.6;fill:none}
  .primary{fill:#161616;font:700 25px Arial,Helvetica,sans-serif}
  .label{fill:#161616;font:700 18px Arial,Helvetica,sans-serif}
  .meta{fill:#505050;font:14px Arial,Helvetica,sans-serif}
  .small{fill:#505050;font:12px Arial,Helvetica,sans-serif;letter-spacing:1px}
  @media(prefers-color-scheme:dark){
    .stroke{stroke:#F0F0F0}
    .thin{stroke:#C9C9C9}
    .primary,.label{fill:#FAFAFA}
    .meta,.small{fill:#D0D0D0}
  }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L7,3.5 L0,7" class="stroke" />
  </marker>
</defs>
<text x="410" y="52" class="primary" text-anchor="middle">CALIFY V1</text>
<text x="410" y="77" class="meta" text-anchor="middle">High-Level System Architecture · Current Integration</text>
<text x="410" y="117" class="small" text-anchor="middle">MOBILE CLIENT</text>
<rect x="170" y="133" width="480" height="98" rx="18" class="stroke"/>
<text x="410" y="174" class="label" text-anchor="middle">Apple Shortcuts</text>
<text x="410" y="203" class="meta" text-anchor="middle">iOS · Course selection and score entry</text>
<path d="M410 232 V308" class="stroke" marker-end="url(#arrow)"/>
<text x="432" y="269" class="meta">HTTPS / JSON</text>
<text x="410" y="352" class="small" text-anchor="middle">WEB API · SERVER-SIDE</text>
<rect x="170" y="368" width="480" height="98" rx="18" class="stroke"/>
<text x="410" y="409" class="label" text-anchor="middle">Google Apps Script</text>
<text x="410" y="438" class="meta" text-anchor="middle">Web App · API and assessment services</text>
<path d="M410 467 V531" class="stroke" marker-end="url(#arrow)"/>
<text x="432" y="506" class="meta">Read / write</text>
<text x="410" y="571" class="small" text-anchor="middle">DATA LAYER</text>
<rect x="170" y="586" width="480" height="80" rx="18" class="stroke"/>
<text x="410" y="620" class="label" text-anchor="middle">Google Sheets</text>
<text x="410" y="644" class="meta" text-anchor="middle">Course-specific grade tracker</text>
<path d="M410 667 V690" class="thin"/>
<path d="M239 690 H581" class="thin"/>
<path d="M239 690 V711" class="thin" marker-end="url(#arrow)"/>
<path d="M581 690 V711" class="thin" marker-end="url(#arrow)"/>
<rect x="98" y="725" width="281" height="75" rx="14" class="stroke"/>
<rect x="441" y="725" width="281" height="75" rx="14" class="stroke"/>
<text x="238" y="756" class="label" text-anchor="middle">Grade Entry</text>
<text x="238" y="780" class="meta" text-anchor="middle">Assessment records</text>
<text x="582" y="756" class="label" text-anchor="middle">Settings</text>
<text x="582" y="780" class="meta" text-anchor="middle">Course-specific rules</text>
<path d="M238 801 V825 H410" class="thin"/>
<path d="M582 801 V825 H410" class="thin"/>
<path d="M410 825 V842" class="thin" marker-end="url(#arrow)"/>
<rect x="257" y="850" width="306" height="58" rx="12" class="stroke"/>
<text x="410" y="883" class="label" text-anchor="middle">Control · Calculations</text>
